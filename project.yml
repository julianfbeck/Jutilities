name: Jutilities
options:
  bundleIdPrefix: sh.juli
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  JutilitiesCore:
    type: library.static
    platform: macOS
    sources: [Sources/JutilitiesCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.juli.JutilitiesCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: libsqlite3.tbd
  Jutilities:
    type: application
    platform: macOS
    sources:
      - Sources/Jutilities
      - path: Config/AppIcon.icns
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Jutilities
        CFBundleName: Jutilities
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSAppleEventsUsageDescription: Jutilities asks macOS to apply sleep settings only when you choose Apply.
        NSHumanReadableCopyright: Copyright © 2026 Julian Beck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.juli.Jutilities
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: JutilitiesCore
      - sdk: libsqlite3.tbd
  JutilitiesCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/JutilitiesCoreTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JutilitiesCore
      - sdk: libsqlite3.tbd
  JutilitiesAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/JutilitiesAppTests
      - Sources/Jutilities/PasteboardMonitor.swift
      - Sources/Jutilities/PowerManager.swift
      - Sources/Jutilities/ClipboardAirDrop.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JutilitiesCore
      - sdk: libsqlite3.tbd
schemes:
  Jutilities:
    build:
      targets:
        Jutilities: all
        JutilitiesCoreTests: [test]
        JutilitiesAppTests: [test]
    test:
      gatherCoverageData: true
      targets: [JutilitiesCoreTests, JutilitiesAppTests]
